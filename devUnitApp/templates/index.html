<!DOCTYPE html>
{% load static %}
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoApp</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- MDB -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{% static 'css/todo-styles.css' %}" rel="stylesheet">
</head>
<body>
    <section class="vh-100">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col">
                    <div class="card" id="list1" style="border-radius: .75rem; background-color: #EFF1F2;">
                        <div class="card-body py-4 px-4 px-md-5">
                            <p class="h1 text-center mt-3 mb-4 pb-3 text-primary">
                                <a href="#" class="app-title" onclick="reloadApp(); return false;">
                                    <i class="fas fa-check-square me-1"></i>
                                    <u>TodoApp</u>
                                </a>
                            </p>
                            <div class="pb-2">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="d-flex flex-row align-items-center">
                                            <input type="text" class="form-control form-control-lg me-2" id="inputTitle" 
                                                   placeholder="新しいタスクを追加">
                                            <button type="submit" class="btn btn-primary btn-lg add-button" style="white-space: nowrap;" onclick="addTodo()">追加</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end align-items-center mb-4 pt-2 pb-3">
                                <p class="small mb-0 me-2 text-muted">フィルター</p>
                                <select id="filterSelect" data-mdb-select-init>
                                    <option value="all">すべて</option>
                                    <option value="completed">完了</option>
                                    <option value="active">進行中</option>
                                </select>
                                
                                <p class="small mb-0 ms-3 me-2 text-muted">優先度</p>
                                <select id="priorityFilterSelect" data-mdb-select-init>
                                    <option value="all">すべて</option>
                                    <option value="高">高</option>
                                    <option value="中">中</option>
                                    <option value="低">低</option>
                                </select>
                            </div>
                            <div id="todo-list">
                                <!-- Todoアイテムがここに動的に挿入される -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- タスク編集モーダル -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editTaskModalLabel">タスクを編集</h5>
                    <button type="button" class="btn-close" data-mdb-dismiss="modal" aria-label="閉じる"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editTaskTitle" class="form-label">タイトル</label>
                        <input type="text" class="form-control" id="editTaskTitle">
                    </div>
                    <div class="mb-3">
                        <label for="editTaskDescription" class="form-label">説明</label>
                        <textarea class="form-control" id="editTaskDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editTaskSchedule" class="form-label">期限日時</label>
                        <input type="datetime-local" class="form-control" id="editTaskSchedule">
                    </div>
                    <div class="mb-3">
                        <label for="editTaskPriority" class="form-label">優先度</label>
                        <select class="form-control" id="editTaskPriority">
                            <option value="高">高</option>
                            <option value="中" selected>中</option>
                            <option value="低">低</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">閉じる</button>
                    <button type="button" class="btn btn-primary" onclick="saveEditedTask()">変更を保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- タスク削除確認モーダル -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">削除の確認</h5>
                    <button type="button" class="btn-close" data-mdb-dismiss="modal" aria-label="閉じる"></button>
                </div>
                <div class="modal-body">
                    <p>このタスクを削除してもよろしいですか？</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">削除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- MDB -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
    
    <!-- Temporary inline script to fix the missing function -->
    <script>
        // Todo items array
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentEditId = null;
        let currentDeleteId = null;
        
        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            renderTodos();
            
            // Add event listener for filter changes
            document.getElementById('filterSelect').addEventListener('change', renderTodos);
            
            // Add event listener for priority filter changes
            document.getElementById('priorityFilterSelect').addEventListener('change', renderTodos);
            
            // Add event listener for Enter key on input field
            document.getElementById('inputTitle').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTodo();
                }
            });
        });
        
        // Function to add a new todo
        function addTodo() {
            const inputElement = document.getElementById('inputTitle');
            const title = inputElement.value.trim();
            
            if (title === '') {
                return; // Don't add empty todos
            }
            
            const newTodo = {
                id: Date.now(),
                title: title,
                description: '',
                completed: false,
                scheduledFor: null,
                priority: '中', // Default priority
                createdAt: new Date().toISOString()
            };
            
            todos.unshift(newTodo); // Add to beginning of array
            saveTodos();
            renderTodos();
            
            // Clear input
            inputElement.value = '';
        }
        
        // Function to toggle todo completion
        function toggleTodo(id) {
            const todo = todos.find(t => t.id == id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
            }
        }
        
        // Function to delete a todo
        function deleteTodo(id) {
            currentDeleteId = id;
            const modal = new mdb.Modal(document.getElementById('deleteConfirmModal'));
            modal.show();
            
            // Set up confirmation button
            document.getElementById('confirmDeleteBtn').onclick = function() {
                todos = todos.filter(t => t.id != currentDeleteId);
                saveTodos();
                renderTodos();
                modal.hide();
                currentDeleteId = null;
            };
        }
        
        // Function to edit a todo
        function editTodo(id) {
            const todo = todos.find(t => t.id == id);
            if (todo) {
                currentEditId = id;
                document.getElementById('editTaskTitle').value = todo.title;
                document.getElementById('editTaskDescription').value = todo.description || '';
                document.getElementById('editTaskSchedule').value = todo.scheduledFor || '';
                
                // Set priority if exists, otherwise default to "中"
                const prioritySelect = document.getElementById('editTaskPriority');
                prioritySelect.value = todo.priority || '中';
                
                // Open modal using MDB method
                const modal = new mdb.Modal(document.getElementById('editTaskModal'));
                modal.show();
            }
        }
        
        // Function to save edited task
        function saveEditedTask() {
            if (currentEditId === null) return;
            
            const todo = todos.find(t => t.id == currentEditId);
            if (todo) {
                todo.title = document.getElementById('editTaskTitle').value.trim();
                todo.description = document.getElementById('editTaskDescription').value.trim();
                todo.scheduledFor = document.getElementById('editTaskSchedule').value || null;
                todo.priority = document.getElementById('editTaskPriority').value;
                
                saveTodos();
                renderTodos();
                
                // Close modal using MDB method
                const modal = mdb.Modal.getInstance(document.getElementById('editTaskModal'));
                modal.hide();
                
                currentEditId = null;
            }
        }
        
        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }
        
        // Render todos based on current filter
        function renderTodos() {
            const todoList = document.getElementById('todo-list');
            const filter = document.getElementById('filterSelect').value;
            const priorityFilter = document.getElementById('priorityFilterSelect').value;
            
            todoList.innerHTML = '';
            
            const filteredTodos = todos.filter(todo => {
                // Status filter
                const statusMatch = 
                    filter === 'all' || 
                    (filter === 'completed' && todo.completed) || 
                    (filter === 'active' && !todo.completed);
                
                // Priority filter
                const priorityMatch = 
                    priorityFilter === 'all' || 
                    todo.priority === priorityFilter;
                
                // Both filters must match
                return statusMatch && priorityMatch;
            });
            
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '<div class="text-center py-4 text-muted">タスクがありません</div>';
                return;
            }
            
            filteredTodos.forEach((todo, index) => {
                const todoItem = document.createElement('div');
                todoItem.className = 'card mb-2';
                todoItem.draggable = true;
                todoItem.dataset.id = todo.id;
                todoItem.dataset.index = index;
                
                // Add drag event listeners
                todoItem.addEventListener('dragstart', handleDragStart);
                todoItem.addEventListener('dragover', handleDragOver);
                todoItem.addEventListener('drop', handleDrop);
                todoItem.addEventListener('dragend', handleDragEnd);
                
                // Format scheduled date if exists
                let scheduleText = '';
                if (todo.scheduledFor) {
                    const scheduleDate = new Date(todo.scheduledFor);
                    scheduleText = `<div class="small text-primary"><i class="fas fa-calendar-alt me-1"></i>${scheduleDate.toLocaleString()}</div>`;
                }
                
                // Format priority with colors
                let priorityClass = '';
                if (todo.priority === '高') priorityClass = 'text-danger';
                else if (todo.priority === '中') priorityClass = 'text-warning';
                else if (todo.priority === '低') priorityClass = 'text-success';
                
                const priorityText = todo.priority ? 
                    `<div class="small ${priorityClass}"><i class="fas fa-flag me-1"></i>優先度: ${todo.priority}</div>` : '';
                
                todoItem.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex flex-row align-items-center">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" ${todo.completed ? 'checked' : ''} 
                                       onchange="toggleTodo(${todo.id})" />
                            </div>
                            <div class="ms-3 flex-grow-1 ${todo.completed ? 'text-decoration-line-through text-muted' : ''}">
                                <div class="fw-bold">${todo.title}</div>
                                ${todo.description ? `<div class="small text-muted" style="word-wrap: break-word; white-space: pre-wrap;">${todo.description}</div>` : ''}
                                ${scheduleText}
                                ${priorityText}
                            </div>
                            <div style="min-width: 80px; text-align: right;">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editTodo(${todo.id})">
                                    <i class="fas fa-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteTodo(${todo.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                todoList.appendChild(todoItem);
            });
        }
        
        // Drag and drop handlers
        let dragSrcEl = null;
        
        function handleDragStart(e) {
            this.style.opacity = '0.4';
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }
        
        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        
        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            
            if (dragSrcEl !== this) {
                const srcId = parseInt(dragSrcEl.dataset.id);
                const destId = parseInt(this.dataset.id);
                const srcIndex = todos.findIndex(t => t.id === srcId);
                const destIndex = todos.findIndex(t => t.id === destId);
                
                if (srcIndex !== -1 && destIndex !== -1) {
                    // Remove the dragged item from its original position
                    const [movedItem] = todos.splice(srcIndex, 1);
                    // Insert the item at the new position
                    todos.splice(destIndex, 0, movedItem);
                    saveTodos();
                    renderTodos();
                }
            }
            
            return false;
        }
        
        function handleDragEnd(e) {
            this.style.opacity = '1';
            
            const items = document.querySelectorAll('#todo-list .card');
            items.forEach(function(item) {
                item.style.opacity = '1';
            });
        }
        
        // Reload app
        function reloadApp() {
            renderTodos();
        }
    </script>
    
    <!-- Custom JS -->
    <script src="{% static 'js/todo-app.js' %}"></script>
</body>
</html>
